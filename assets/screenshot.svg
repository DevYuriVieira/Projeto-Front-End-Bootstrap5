<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1720"/>
    </linearGradient>
    <style>
      .title{font:700 28px/1.2 'Segoe UI', Roboto, Arial; fill:#e6eef8}
      .sub{font:400 16px/1.4 'Segoe UI', Roboto, Arial; fill:#94a3b8}
      .card{fill:rgba(255,255,255,0.02); stroke:rgba(255,255,255,0.03);}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <text x="48" y="64" class="title">AdminDash — Painel Administrativo (preview)</text>
  <text x="48" y="96" class="sub">Protótipo front-end com Bootstrap & Chart.js — ideal para portfolio</text>
  <!-- sample cards -->
  <rect x="48" y="130" width="1200" height="220" rx="8" class="card"/>
  <g fill="#cbd5e1" font-family="Segoe UI, Roboto, Arial" font-size="14">
    <text x="72" y="166">Usuários</text>
    <text x="72" y="200" font-size="20" font-weight="700">1.245</text>
    <text x="272" y="166">Vendas</text>
    <text x="272" y="200" font-size="20" font-weight="700">R$ 92.400</text>
    <text x="472" y="166">Lucros</text>
    <text x="472" y="200" font-size="20" font-weight="700">R$ 24.800</text>
  </g>
  <g transform="translate(48,380)">
    <rect width="640" height="160" rx="8" class="card"/>
    <text x="16" y="28" class="sub">Tabela de Usuários — filtro e paginação</text>
  </g>
</svg>
